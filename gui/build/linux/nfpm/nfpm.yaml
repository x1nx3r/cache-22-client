# nfpm config for the Cache-22 Linux packages (deb / rpm / archlinux).
# Both binaries ship: the GUI app as cache22, the pure-Go CLI as cache22-cli.
# PACKAGE_VERSION is provided by the linux Taskfile (git describe, v-stripped).
name: "cache22"
arch: ${GOARCH}
platform: "linux"
version: ${PACKAGE_VERSION}
section: "default"
priority: "extra"
maintainer: "x1nx3r <x1nx3r@users.noreply.github.com>"
description: "PS2 library streamer - client GUI and CLI (sparse ISO store, cloud saves)"
vendor: "x1nx3r"
homepage: "https://github.com/x1nx3r/cache-22-client"
release: "1"

contents:
  - src: "./bin/cache22"
    dst: "/usr/bin/cache22"
  - src: "./bin/cache22-cli"
    dst: "/usr/bin/cache22-cli"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/cache22.png"
  - src: "./build/linux/cache22.desktop"
    dst: "/usr/share/applications/cache22.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+).
# The CLI is pure Go and needs none of these; the GUI does.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
